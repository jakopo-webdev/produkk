<header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">

    <!-- Logo -->
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center shadow-md shadow-indigo-600/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <span class="text-white font-bold text-base tracking-tight">Produkk</span>
    </div>

    <!-- User + Logout -->
    <div class="flex items-center gap-3">
      @if (auth.currentUser()) {
        <span class="text-gray-500 text-sm hidden sm:block">{{ auth.currentUser()!.username }}</span>
      }
      <button
        (click)="auth.logout()"
        class="flex items-center gap-1.5 text-gray-400 hover:text-white hover:bg-gray-800 text-sm font-medium px-3 py-1.5 rounded-lg transition-all"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
          <polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Logout
      </button>
    </div>

  </div>
</header>
