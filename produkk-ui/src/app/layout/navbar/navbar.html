<header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2.5">
      <img src="assets/produkk-logo.png" alt="Produkk" class="w-8 h-8 rounded-lg object-cover" />
      <span class="text-white font-bold text-base tracking-tight">Produkk</span>
    </a>

    <!-- Logout -->
    <div *ngIf="auth.currentUser()" class="flex items-center gap-3">
      <button
        (click)="auth.logout()"
        class="flex items-center gap-1.5 text-gray-400 hover:text-white hover:bg-gray-800 text-sm font-medium px-3 py-1.5 rounded-lg transition-all"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
          <polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Logout
      </button>
    </div>

  </div>
</header>
