server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /auth/ { 
    proxy_pass http://produkk-api.railway.internal:3009/auth/; 
    proxy_set_header Host $host;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
  
  location /tasks { 
    proxy_pass http://produkk-api.railway.internal:3009/tasks; 
    proxy_set_header Host $host;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
  
  location /tasks/ { 
    proxy_pass http://produkk-api.railway.internal:3009/tasks/; 
    proxy_set_header Host $host;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}