version: "3.8"
services:
  db:
    image: postgres:15
    volumes:
      - db-data:/var/lib/postgresql/data
    # 🔒 Removed env_file and ports for security

  api:
    build:
      context: ./produkk-api
    # 🔒 Removed env_file line
    ports:
      - "3009:3009"
    depends_on:
      - db
    restart: unless-stopped

  ui:
    build:
      context: ./produkk-ui
      dockerfile: Dockerfile.prod
    # 🌐 Let Railway automatically route public traffic to port 80 (Nginx)
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # 🔒 Removed ports block

volumes:
  db-data:
  redis-data: