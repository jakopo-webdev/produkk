version: "3.8"
services:
  db:
    image: postgres:15
    env_file:
      - ./produkk-api/.env
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./produkk-api
    env_file:
      - ./produkk-api/.env
    ports:
      - "3009:3009"
    depends_on:
      - db
    restart: unless-stopped

  ui:
    build:
      context: ./produkk-ui
      dockerfile: Dockerfile.prod
    ports:
      - "4209:80"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
