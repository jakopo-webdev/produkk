version: "3.8"
services:
  db:
    image: postgres:15
    env_file:
      - ./produkk-api/.env
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./produkk-api
    env_file:
      - ./produkk-api/.env
    ports:
      - "3009:3009"
    depends_on:
      - db
    restart: unless-stopped

  ui:
    build:
      context: ./produkk-ui
    ports:
      - "4209:4209"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
