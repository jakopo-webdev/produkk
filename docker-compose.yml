version: "3.8"
services:
  db:
    image: postgres:15
    env_file:
      - ./produkk-api/.env
    volumes:
      - db-data:/var/lib/postgresql/data
    # 🔒 Removed ports block for security

  api:
    build:
      context: ./produkk-api
    env_file:
      - ./produkk-api/.env
    ports:
      - "3009:3009"
    depends_on:
      - db
    restart: unless-stopped

  ui:
    build:
      context: ./produkk-ui
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 🔒 Removed ports block for security
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data: